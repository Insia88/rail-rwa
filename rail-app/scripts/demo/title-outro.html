<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #071009; color: #F2EDE2; font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(242,237,226,.12); }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(1000px 640px at 78% 30%, rgba(255,75,31,.20), transparent 60%),
    radial-gradient(700px 480px at 12% 86%, rgba(217,255,92,.05), transparent 70%),
    linear-gradient(160deg,#070908 0%, #0A0D0B 60%, #070908 100%); }
  .inner { position: absolute; inset: 0; padding: 90px 96px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .28em; color: rgba(242,237,226,.5); }
  h1 { margin-top: 26px; font-size: 82px; font-weight: 800; line-height: 1.04; letter-spacing: -.022em; }
  h1 em { font-style: normal; color: #FF4B1F; }
  .sub { margin-top: 22px; font-size: 24px; color: rgba(242,237,226,.6); }
  .cta { margin-top: 46px; display: inline-flex; align-items: center; gap: 14px; }
  .btn { background: #FF4B1F; color: #070908; font-weight: 700; font-size: 18px; padding: 16px 26px; }
  .url { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: .12em; color: rgba(242,237,226,.65); }
  .foot { position: absolute; left: 96px; right: 96px; bottom: 78px; display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .18em; color: rgba(242,237,226,.35); }
</style>
</head>
<body>
  <div class="glow"></div><div class="frame"></div>
  <div class="inner">
    <p class="kicker">NEXT LAP</p>
    <h1>다음 랩의 신용은,<br /> 이미 <em>흐르고</em> 있습니다.</h1>
    <p class="sub">은행이 읽지 못하는 매출을, 신용으로 번역하는 온체인 레일.</p>
    <div class="cta"><span class="btn">rail-rwa.vercel.app</span><span class="url">3분 데모 · 한빛전자 심사 →</span></div>
  </div>
  <div class="foot"><span>RAIL · SEOUL · 2026</span><span>CREDIT PASSPORT · RWA EXPORT CREDIT</span></div>
</body>
</html>
