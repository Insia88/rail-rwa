<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("../../rail-app/public/fonts/archivo-var.woff2") format("woff2-variations");
        font-weight: 400 900;
        font-display: block;
      }
      @font-face {
        font-family: "Plex Mono";
        src: url("../../rail-app/public/fonts/plex-mono-400.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
        background: #f7f6f3 url("../../rail-app/public/art/v7/hero-light.webp") center/cover;
        color: #0a0b0d;
        position: relative;
        overflow: hidden;
      }
      .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
      .top { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 2px; font-family: "Archivo", sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -0.018em; }
      .dot { width: 14px; height: 14px; background: #f04e23; margin-left: 3px; margin-top: 24px; }
      .kicker { font-size: 16px; color: #8a8f98; font-weight: 500; }
      h1 { margin-top: 48px; font-size: 62px; line-height: 1.12; letter-spacing: -0.035em; font-weight: 700; max-width: 760px; }
      h1 em { font-style: normal; color: #f04e23; }
      .sub { margin-top: 20px; font-size: 20px; line-height: 1.55; color: #4a4f57; max-width: 620px; }
      .footer { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
      .url { font-family: "Plex Mono", monospace; font-size: 16px; color: #4a4f57; letter-spacing: -0.01em; }
      .tags { display: flex; gap: 8px; }
      .tag { border: 1px solid rgba(10,11,13,0.12); border-radius: 999px; padding: 7px 13px; font-size: 14px; color: #4a4f57; background: rgba(255,255,255,.6); }
      .card {
        position: absolute; right: 72px; top: 150px; width: 336px;
        background: #fff; border: 1px solid rgba(10,11,13,0.08); border-radius: 24px;
        box-shadow: 0 30px 80px -40px rgba(10,11,13,0.35); padding: 24px;
      }
      .card .label { font-size: 13px; color: #8a8f98; }
      .card .id { position: absolute; right: 24px; top: 24px; font-family: "Plex Mono", monospace; font-size: 11px; color: #8a8f98; }
      .card .name { margin-top: 26px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
      .card .meta { margin-top: 4px; font-size: 13px; color: #8a8f98; }
      .card .chip { margin-top: 18px; display: flex; justify-content: space-between; background: #f7f6f3; border-radius: 14px; padding: 10px 13px; font-size: 13px; }
      .card .chip b { color: #f04e23; font-weight: 600; }
      .card .nums { display: flex; gap: 18px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(10,11,13,.08); }
      .card .n { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
      .card .k { font-size: 12px; color: #8a8f98; margin-top: 3px; }
      .card .n.orange { color: #f04e23; }
      .card .foot { margin-top: 16px; display: flex; justify-content: space-between; font-size: 11px; color: #8a8f98; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">RAIL<span class="dot"></span></div>
        <div class="kicker">수출채권 팩토링 · RWA · Seoul</div>
      </div>
      <h1>은행이 거절한 매출,<br /><em>신용이 됩니다.</em></h1>
      <p class="sub">수출 정산·구매주문서·특허를 증거로 읽어 신용 여권을 발급하고, 승인된 수출채권을 RWA로 발행합니다.</p>
      <div class="card">
        <span class="label">Credit Passport</span>
        <span class="id">RAIL-P-2026-0001</span>
        <p class="name">한빛전자</p>
        <p class="meta">부산 · 수출 중소기업 · 5인</p>
        <div class="chip"><span>판정 <b>승인</b></span><span>등급 B</span></div>
        <div class="nums">
          <div><div class="n orange">1.8억원</div><div class="k">승인 한도</div></div>
          <div><div class="n">8.55%</div><div class="k">적용 금리 · APR</div></div>
        </div>
        <div class="foot"><span>증거 커버리지 72%</span><span>규칙 엔진 산출</span></div>
      </div>
      <div class="footer">
        <div>
          <div class="url">rail-rwa.vercel.app</div>
          <div class="tags" style="margin-top:14px">
            <span class="tag">3분 데모</span>
            <span class="tag">영문판 /en</span>
            <span class="tag">데모 · 실제 금융 서비스 아님</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
